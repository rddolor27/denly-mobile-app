name: Build Preview (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit'
        type: string
        default: main
      platform:
        description: 'Platform to build'
        type: choice
        options:
          - android
          - ios
          - all
        default: android

permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.event.inputs.ref }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}
    permissions:
      contents: read

  build:
    name: EAS build (preview)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          version=$(node -p "(require('./package.json').packageManager || '').split('@')[1] || ''")
          if [ -z "$version" ]; then
            version=10
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # expo-github-action installs the EAS CLI via the given packager; default is yarn,
      # this repo uses pnpm (ADR 0013 / .claude/CLAUDE.md), so packager is set explicitly.
      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: EAS build (preview)
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -o pipefail
          eas build --platform "$PLATFORM" --profile preview --non-interactive --no-wait | tee eas-build-output.txt

      - name: Write summary
        if: always()
        env:
          BUILD_REF: ${{ inputs.ref }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "## Preview build"
            echo ""
            echo "- Ref: \`$BUILD_REF\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Platform: \`$PLATFORM\`"
            echo ""
            echo "### EAS builds"
          } >> "$GITHUB_STEP_SUMMARY"
          links=$(grep -Eo 'https://expo\.dev\S*' eas-build-output.txt 2>/dev/null || true)
          if [ -n "$links" ]; then
            while read -r link; do echo "- $link"; done <<< "$links" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- (no build link captured — see the EAS build step log above)" >> "$GITHUB_STEP_SUMMARY"
          fi
